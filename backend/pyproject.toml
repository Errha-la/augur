[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "augur"
version = "0.1.0"
description = "AUGUR: F1 race replay, prediction, and analysis"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.3.3",
    "pyarrow==26.0.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "numpy==2.5.5",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "google-genai==3.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: downloads real OpenF1 data; skipped unless --run-network is given",
]
